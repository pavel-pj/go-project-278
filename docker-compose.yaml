services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5500:5432"
    networks:
      - app-network


  # Тестовая БД - отдельный сервис
  postgres_test:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_TEST_NAME}
      - POSTGRES_USER=${DB_USER_TEST}
      - POSTGRES_PASSWORD=${DB_PASSWORD_TEST}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5501:5432"   
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_TEST} -d ${DB_TEST_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5    

  backend:
    build: 
      context: .
      dockerfile: ./docker/development/Dockerfile
    ports:
      - "8080:8080"   
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BASE_SITE: ${BASE_SITE}
      DOCKER_HOST: unix:///var/run/docker.sock
      
       # ========== ТЕСТОВАЯ БД==========
      DOCKER_ENV: "true"
      DB_TEST_HOST: postgres_test
      DB_TEST_PORT: 5432
      DB_USER_TEST: ${DB_USER_TEST}
      DB_PASSWORD_TEST: ${DB_PASSWORD_TEST}
      DB_TEST_NAME: ${DB_TEST_NAME}
      TEST_DATABASE_URL: postgres://${DB_USER_TEST}:${DB_PASSWORD_TEST}@postgres_test:5432/${DB_TEST_NAME}?sslmode=disable



    depends_on:
      - postgres
    volumes:
      - ./:/app   
      - /var/run/docker.sock:/var/run/docker.sock  
    restart: unless-stopped
    networks:
      - app-network
    # Добавь для отладки:
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_test_data: