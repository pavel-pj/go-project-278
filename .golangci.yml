version: "2"

run:
  timeout: 5m
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: false

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - noctx
    - gocyclo
    - goconst
    - gocritic
    - revive
    - godot
    - godox
    - prealloc
    - wastedassign
    - errorlint
    - nilerr
    - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports

# Directories to exclude from analysis
issues:
  exclude-dirs-use-default: false
  include:
    - "**/*.go"
  # Exclude specific directories
  exclude:
    - "^vendor/"
    - "^bin/"
    - "^gen/"
  # Rule-based exclusions
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - noctx
    - path: internal/linksdb/.*\.go
      linters:
        - wrapcheck
        - errcheck
        - gosec
        - noctx
      text: "sqlc generated file"