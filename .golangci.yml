version: "2"

run:
  timeout: 5m
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: false

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - noctx
    - gocyclo
    - goconst
    - gocritic
    #- revive
    #- godot
    #- godox
    - prealloc
    - wastedassign
    - errorlint
    - nilerr
    - wrapcheck

linters-settings:
  revive:
    rules:
      - name: var-naming
        disabled: true
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true
      - name: comment-spacings
        disabled: true
  godot:
    enabled: false
  godox:
    enabled: false

formatters:
  enable:
    - gofmt
    - goimports